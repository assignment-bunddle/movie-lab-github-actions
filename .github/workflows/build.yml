# .githun/workflows/build.yml
name: Node Build.

on: [push]

jobs:
  mainbuild:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        node-version: [24.x]
        os: [windows-latest]

    steps:
      - uses: actions/checkout@v7
      - name: Run node.js on latest Windows.
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install NPM and build.
        run: |
          npm ci
          npm run build
          
      - uses: actions/upload-pages-artifact@v7
        with:
          path: dist

  deployment:
    needs: mainbuild
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v7
